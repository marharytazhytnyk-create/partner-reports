name: MBR — Mavra / Josper / Coffee Art

on:
  schedule:
    # 1-го числа кожного місяця о 13:00 Київ (EEST UTC+3 = 10:00 UTC)
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-mbr-mavra:
    name: Generate MBR Mavra / Josper / Coffee Art
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate MBR Mavra report
        env:
          DATABRICKS_HOST:       ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN:      ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}
        run: python "MBR Mavra/generate_mbr_mavra.py"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "MBR Mavra/"
          git diff --staged --quiet || git commit -m "📊 MBR Mavra — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
